# Sherpa v1 stack: Postgres + Redis + migrate + web + worker + frontend.
# One command:  docker compose -f infra/docker-compose.yml up --build
#
# Boots with safe DEV defaults (owner: owner@localhost / sherpa-dev-password).
# For a real deployment, copy .env.example -> .env, set real APP_SECRET / KEK /
# OWNER_* / provider keys, and pass `--env-file .env` (or add env_file back).
#
# URLs once up:  UI http://localhost:5173  ·  API http://localhost:8000
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sherpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherpa}
      POSTGRES_DB: ${POSTGRES_DB:-sherpa}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sherpa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sherpa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sherpa-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply DB migrations before web/worker start. Re-runs are no-ops.
  migrate:
    build: ../backend
    command: uv run alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@postgres:5432/${POSTGRES_DB:-sherpa}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}

  web:
    build: ../backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@postgres:5432/${POSTGRES_DB:-sherpa}
      REDIS_URL: redis://redis:6379/0
      # Provider config so /meta and any sync path reflect the real model (the
      # worker runs the loop; the web only reports provider kind/model).
      PROVIDER_KIND: ${PROVIDER_KIND:-mock}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-http://host.docker.internal:4000}
      PROVIDER_MODEL: ${PROVIDER_MODEL:-claude-sonnet-4.6}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      # Embeddings (ADR-032): decoupled from the chat provider. Default mock
      # (offline). Set EMBEDDING_KIND=ollama + run `--profile embeddings` for the
      # bundled local bge-m3 (1024-d). Web serves REST memory search, so it embeds too.
      EMBEDDING_KIND: ${EMBEDDING_KIND:-mock}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      STORAGE_KIND: ${STORAGE_KIND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sherpa}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sherpa-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-sherpa-files}
      # QQ official bot (ADR-028) is configured at runtime in the UI (DB-backed,
      # AppID/AppSecret sealed in the vault) — no QQ_* env. The botpy WebSocket
      # client runs in the worker.
      # Agentic email (milestone 5). Disabled ('recording') by default; set these
      # in .env to send/receive via a real AgentMail inbox. The web shows status +
      # authenticates the inbound webhook; the worker performs the actual send.
      EMAIL_KIND: ${EMAIL_KIND:-recording}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      AGENTMAIL_INBOX_ID: ${AGENTMAIL_INBOX_ID:-}
      AGENTMAIL_WEBHOOK_SECRET: ${AGENTMAIL_WEBHOOK_SECRET:-}
      AGENTMAIL_OWNER_EMAIL: ${AGENTMAIL_OWNER_EMAIL:-}
      # Agent observability (ADR-033). Off by default (zero overhead). When true
      # with no OTLP endpoint, spans dump to this container's stdout
      # (docker compose logs); set OTEL_EXPORTER_OTLP_ENDPOINT for a backend (Phase B).
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CAPTURE_MESSAGE_CONTENT: ${OTEL_CAPTURE_MESSAGE_CONTENT:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    build: ../backend
    command: uv run arq app.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@postgres:5432/${POSTGRES_DB:-sherpa}
      REDIS_URL: redis://redis:6379/0
      # Model provider. Defaults to mock (offline). To use a real model, set
      # PROVIDER_KIND=openai_compatible and PROVIDER_API_KEY in .env (gitignored).
      # host.docker.internal reaches a proxy (e.g. litellm) on the host.
      PROVIDER_KIND: ${PROVIDER_KIND:-mock}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-http://host.docker.internal:4000}
      PROVIDER_MODEL: ${PROVIDER_MODEL:-claude-sonnet-4.6}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      # Embeddings (ADR-032): the worker runs archival memory writes/formation.
      # Default mock (offline); set EMBEDDING_KIND=ollama + `--profile embeddings`
      # for the bundled local bge-m3 (1024-d). Decoupled from PROVIDER_*.
      EMBEDDING_KIND: ${EMBEDDING_KIND:-mock}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      STORAGE_KIND: ${STORAGE_KIND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sherpa}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sherpa-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-sherpa-files}
      SANDBOX_KIND: ${SANDBOX_KIND:-docker}
      EMAIL_KIND: ${EMAIL_KIND:-recording}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      AGENTMAIL_INBOX_ID: ${AGENTMAIL_INBOX_ID:-}
      AGENTMAIL_WEBHOOK_SECRET: ${AGENTMAIL_WEBHOOK_SECRET:-}
      AGENTMAIL_OWNER_EMAIL: ${AGENTMAIL_OWNER_EMAIL:-}
      # Agent observability (ADR-033). The worker runs the loop, so its stdout
      # carries the gen_ai span dumps when OTEL_ENABLED=true with no OTLP endpoint.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CAPTURE_MESSAGE_CONTENT: ${OTEL_CAPTURE_MESSAGE_CONTENT:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  frontend:
    build: ../frontend
    environment:
      VITE_API_PROXY: http://web:8000
    ports: ["5173:5173"]
    depends_on: [web]

  # Bundled local embedding model (ADR-032). Behind the `embeddings` profile so
  # the core stack stays light (default EMBEDDING_KIND=mock). Enable real semantic
  # memory with `docker compose --profile embeddings up` and set
  # EMBEDDING_KIND=ollama. Pulls bge-m3 (~1.2 GB, 1024-d, multilingual incl. CJK)
  # on first boot; personal memory is embedded on-box and never leaves the machine.
  ollama:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${EMBEDDING_MODEL:-bge-m3}; wait"
    volumes: ["ollamadata:/root/.ollama"]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q ${EMBEDDING_MODEL:-bge-m3}"]
      interval: 10s
      timeout: 5s
      retries: 60

  # Optional agent-observability UI (ADR-033 Phase B). NOT started with the core
  # stack — enable with `--profile observability`. Reuses the existing Postgres
  # (separate `phoenix` schema, no new datastore). Point the app at it with
  # OTEL_ENABLED=true, OTEL_CAPTURE_MESSAGE_CONTENT=true (opt-in, PII), and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4317, then restart web+worker.
  # UI: http://localhost:6006.
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["observability"]
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@postgres:5432/${POSTGRES_DB:-sherpa}
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
    ports:
      - "6006:6006"   # Phoenix UI + OTLP HTTP collector
      - "4317:4317"   # OTLP gRPC collector
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
