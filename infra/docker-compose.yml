version: "3.9"

# Sherpa v1 supported stack: Postgres + Redis + web + worker + frontend.
# MinIO / pgvector are deferred out of v1 (ADR-012/022).
# One-command dev: `docker compose --env-file .env up --build`

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sherpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherpa}
      POSTGRES_DB: ${POSTGRES_DB:-sherpa}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sherpa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@postgres:5432/${POSTGRES_DB:-sherpa}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ../backend
    command: uv run arq app.worker.WorkerSettings
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@postgres:5432/${POSTGRES_DB:-sherpa}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build: ../frontend
    command: npm run dev -- --host
    ports: ["5173:5173"]
    depends_on: [web]

volumes:
  pgdata:
  redisdata:
